services:
  food-assistant:
    build:
      context: .
      args:
        APP_UID: ${APP_UID}
        APP_GID: ${APP_GID}

    image: local/food-assistant:0.20.1
    container_name: food-assistant

    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    ports:
      - "8787:8000"

    environment:
      TZ: ${TZ}
      MEALIE_BASE_URL: ${MEALIE_BASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX}
      MEALIE_TOKEN_FILE: /run/secrets/mealie_token
      DATA_DIR: /data

    volumes:
      - type: bind
        source: /srv/appdata/food-assistant/data
        target: /data
        bind:
          create_host_path: false

    secrets:
      - source: mealie_token
        target: mealie_token
        mode: 0400

    security_opt:
      - no-new-privileges:true

    mem_limit: 512m

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/healthz',
          timeout=3
          ).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

secrets:
  mealie_token:
    file: /srv/appdata/food-assistant/secrets/mealie_token
