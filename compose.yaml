services:
  food-assistant:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ${FOOD_ASSISTANT_IMAGE:-local/food-assistant:0.25.0}
    container_name: ${FOOD_ASSISTANT_CONTAINER_NAME:-food-assistant}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${FOOD_ASSISTANT_PORT:-8787}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.25.0}
      TZ: ${TZ:-UTC}
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/food-assistant.db}
      FOOD_ASSISTANT_API_TOKEN: ${FOOD_ASSISTANT_API_TOKEN:-}
      FOOD_ASSISTANT_API_TOKEN_FILE: ${FOOD_ASSISTANT_API_TOKEN_FILE:-}
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:-http://host.docker.internal:9925}
      MEALIE_TOKEN: ${MEALIE_TOKEN:-}
      MEALIE_TOKEN_FILE: ${MEALIE_TOKEN_FILE:-}
      MEALIE_TIMEOUT_SECONDS: ${MEALIE_TIMEOUT_SECONDS:-90}
      MEALIE_CONNECT_TIMEOUT_SECONDS: ${MEALIE_CONNECT_TIMEOUT_SECONDS:-5}
      MEALIE_WRITE_TIMEOUT_SECONDS: ${MEALIE_WRITE_TIMEOUT_SECONDS:-10}
      MEALIE_POOL_TIMEOUT_SECONDS: ${MEALIE_POOL_TIMEOUT_SECONDS:-10}
      MEALIE_RECOMMENDATION_CONCURRENCY: ${MEALIE_RECOMMENDATION_CONCURRENCY:-8}
      MEALIE_RECIPE_CACHE_TTL_SECONDS: ${MEALIE_RECIPE_CACHE_TTL_SECONDS:-21600}
      HOME_ASSISTANT_KITCHEN_URL: ${HOME_ASSISTANT_KITCHEN_URL:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_KEY_FILE: ${LLM_API_KEY_FILE:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_CONNECT_TIMEOUT_SECONDS: ${LLM_CONNECT_TIMEOUT_SECONDS:-10}
      LLM_CONTEXT_LENGTH: ${LLM_CONTEXT_LENGTH:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-4096}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      LLM_KEEP_ALIVE: ${LLM_KEEP_ALIVE:-}
      LLM_UNLOAD_AFTER_BATCH: ${LLM_UNLOAD_AFTER_BATCH:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
    volumes:
      - type: bind
        source: ${FOOD_ASSISTANT_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${FOOD_ASSISTANT_MEMORY_LIMIT:-512m}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/healthz', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
