[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "food-assistant"
version = "0.23.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12,<1",
  "httpx>=0.28.1,<1",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.34.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "PyYAML>=6,<7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["backup-v*", "*.bak"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
