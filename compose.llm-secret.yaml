# Optional LLM API key Docker Secret overlay for openai_compatible providers.
services:
  food-assistant:
    environment:
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
    secrets:
      - llm_api_key

secrets:
  llm_api_key:
    file: ${LLM_API_KEY_HOST_FILE:-./secrets/llm_api_key}
